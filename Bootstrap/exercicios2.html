<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="container">
      <h1>Exercicio 1 Bootstrap</h1>
      <div class="row">
        <div class="col-12 text-white text-center bg-success border">
          Header
        </div>
      </div>
      <div class="row">
        <div
          class="col-12 offset-sm-4 offset-md-2 col-sm-4 text-white text-center bg-info border"
        >
          Info 1
        </div>
        <div class="col-12 col-sm-4 text-white text-center bg-info border">
          Info 2
        </div>
      </div>

      <div class="row">
        <div class="col-12 text-white text-center bg-secondary border">
          Section
        </div>
      </div>
      <div class="row">
        <div class="col-12 col-sm-4 text-white text-center bg-info border">
          Info 3
        </div>

        <div
          class="col-12 col-sm-4 offset-md-4 text-white text-center bg-info border"
        >
          Info 4
        </div>
      </div>
      <div class="row">
        <div
          class="col-12 d-sm-none d-md-inline text-white text-center bg-danger border"
        >
          Exclusive mobile
        </div>
      </div>
      <div class="row">
        <div
          class="col-3 text-white text-center bg-primary border order-sm-4 order-md-2"
        >
          1
        </div>
        <div
          class="col-3 text-white text-center bg-primary border order-sm-3 order-md-1"
        >
          2
        </div>
        <div
          class="col-3 text-white text-center bg-primary border order-sm-2 order-md-4"
        >
          3
        </div>
        <div
          class="col-3 text-white text-center bg-primary border order-sm-1 order-md-3"
        >
          4
        </div>
      </div>
      <div class="row">
        <div class="col-6 col-md text-white text-center bg-info border">1</div>
        <div class="col-6 col-md text-white text-center bg-info border">2</div>
        <div class="col-6 col-md text-white text-center bg-info border">3</div>
        <div class="col-6 col-md text-white text-center bg-info border">4</div>
        <div class="col-6 col-md text-white text-center bg-info border">5</div>
      </div>
      <div class="row">
        <div class="col-12 text-white text-center bg-success border">
          Footer
        </div>
      </div>
    </div>
    <div class="container">
      <h1>Exercicio 2 Bootstrap</h1>
      <div class="row">
        <div class="col-12 mb-1 border border-black">Header</div>
      </div>
      <div class="row mb-1 border border-black">
        <div class="col-md-3">Inicio</div>
        <div class="col-md-3">Quienes somos</div>
        <div class="col-md-3">Servicios</div>
        <div class="col-md-3">Contacto</div>
      </div>
      <div class="row">
        <div class="col-md-3 order-md-1 order-4 border border-black">
          Aside
          <p>Contenido</p>
        </div>
        <div class="col-md-9 order-md-4 order-1 border border-black">
          <div class="row p-1">
            <div class="col-md-3 col-6 border border-black">
              Card 1
              <p>Contenido</p>
            </div>
            <div class="col-md-3 col-6 border border-black">
              Card 2
              <p>Contenido</p>
            </div>
            <div class="col-md-3 col-6 border border-black">
              Card 3
              <p>Contenido</p>
            </div>
            <div class="col-md-3 col-6 border border-black">
              Card 4
              <p>Contenido</p>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-12 mt-1 border border-black">Footer</div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
